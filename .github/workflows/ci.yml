name: Repository checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - name: Cache package store
        uses: actions/cache@v4
        with:
          path: .sites-runtime/pnpm-store
          key: ${{ runner.os }}-node-22.23.2-pnpm-11.25.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Verify migrations and schema
        run: pnpm db:check
      - name: Production build
        run: pnpm build
      - name: Initialize local database
        run: pnpm db:migrate:local
      - name: Local HTTP smoke test
        run: node scripts/local-smoke.mjs
